<!doctype html>
<html lang="{{lang}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{site_name}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="profile">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f3f0e7">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{font_preload}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{css}}">
<script src="{{theme_js}}"></script>
<script src="{{main_js}}" defer></script>
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body data-strings="{{js_strings}}">
{{body}}
</body>
</html>
